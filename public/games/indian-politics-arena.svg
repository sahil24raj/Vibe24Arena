<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B1E" />
      <stop offset="50%" stop-color="#0B1A3D" />
      <stop offset="100%" stop-color="#02050E" />
    </linearGradient>
    <linearGradient id="saffronGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00D2FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Center Arena Glow -->
  <circle cx="600" cy="337" r="450" fill="url(#centerGlow)" />

  <!-- Parliament Dome Silhouette Background -->
  <path d="M 350 480 Q 600 150 850 480 Z" fill="#0A1838" stroke="#FFD700" stroke-width="2" opacity="0.6" />
  
  <!-- Parliament Colonnade Pillars -->
  <g fill="#0E234A" stroke="#FFD700" stroke-width="1" opacity="0.5">
    <rect x="380" y="320" width="18" height="160" />
    <rect x="440" y="280" width="18" height="200" />
    <rect x="500" y="250" width="18" height="230" />
    <rect x="560" y="235" width="18" height="245" />
    <rect x="620" y="235" width="18" height="245" />
    <rect x="680" y="250" width="18" height="230" />
    <rect x="740" y="280" width="18" height="200" />
    <rect x="800" y="320" width="18" height="160" />
  </g>

  <!-- Stage Floor -->
  <rect x="0" y="480" width="1200" height="195" fill="#081024" />
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#FF9933" stroke-width="5" filter="url(#glow)" />

  <!-- Action Sparks / Lightning -->
  <path d="M 500 440 L 580 340 L 560 380 L 650 280 L 620 330 L 710 240" stroke="#FFD700" stroke-width="4" fill="none" filter="url(#glow)" />
  <path d="M 680 430 L 620 350 L 640 370 L 570 290" stroke="#00D2FF" stroke-width="4" fill="none" filter="url(#glow)" />

  <!-- Fighter 1 Silhouette (Chai Commander - Saffron Aura) -->
  <g transform="translate(360, 480)">
    <!-- Shadow -->
    <ellipse cx="0" cy="0" rx="70" ry="16" fill="rgba(0,0,0,0.6)" />
    <!-- Saffron Aura -->
    <circle cx="0" cy="-120" r="110" fill="#FF9933" opacity="0.2" filter="url(#glow)" />
    <!-- Body -->
    <rect x="-35" y="-170" width="70" height="110" rx="16" fill="#FF9933" stroke="#FFFFFF" stroke-width="3" />
    <!-- Head -->
    <circle cx="0" cy="-210" r="32" fill="#F3F4F6" stroke="#111827" stroke-width="4" />
    <!-- White Beard & Specs -->
    <path d="M -22 -200 Q 0 -170 22 -200 Z" fill="#FFFFFF" />
    <rect x="4" y="-216" width="14" height="12" fill="none" stroke="#111827" stroke-width="3" />
    <rect x="-18" y="-216" width="14" height="12" fill="none" stroke="#111827" stroke-width="3" />
    <!-- Punch Fist -->
    <circle cx="65" cy="-135" r="18" fill="#FFD700" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)" />
  </g>

  <!-- VS Emblem in Center -->
  <g transform="translate(600, 360)">
    <circle cx="0" cy="0" r="45" fill="#060B1E" stroke="#FFD700" stroke-width="4" filter="url(#glow)" />
    <text x="0" y="14" font-family="Arial Black, Impact, sans-serif" font-size="38" font-weight="900" fill="#FFD700" text-anchor="middle">VS</text>
  </g>

  <!-- Fighter 2 Silhouette (Vikas Baba / Rival - Cyan Aura) -->
  <g transform="translate(840, 480) scale(-1, 1)">
    <!-- Shadow -->
    <ellipse cx="0" cy="0" rx="70" ry="16" fill="rgba(0,0,0,0.6)" />
    <!-- Cyan Aura -->
    <circle cx="0" cy="-120" r="110" fill="#00D2FF" opacity="0.2" filter="url(#glow)" />
    <!-- Body -->
    <rect x="-38" y="-175" width="76" height="115" rx="16" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" />
    <!-- Head -->
    <circle cx="0" cy="-215" r="34" fill="#F3F4F6" stroke="#111827" stroke-width="4" />
    <!-- Kick Strike -->
    <line x1="10" y1="-80" x2="75" y2="-120" stroke="#00D2FF" stroke-width="18" stroke-linecap="round" />
    <circle cx="75" cy="-120" r="16" fill="#FFFFFF" stroke="#00D2FF" stroke-width="3" filter="url(#glow)" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(600, 110)">
    <!-- Vibe Arena Brand Tag -->
    <rect x="-110" y="-75" width="220" height="28" rx="14" fill="#060B1E" stroke="#FF9933" stroke-width="2" />
    <text x="0" y="-56" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="#FFD700" text-anchor="middle" letter-spacing="3">VIBE ARENA ORIGINAL</text>

    <!-- Main Game Title -->
    <text x="0" y="5" font-family="Arial Black, Impact, sans-serif" font-size="64" font-weight="900" fill="url(#saffronGold)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">INDIAN POLITICS</text>
    <text x="0" y="70" font-family="Arial Black, Impact, sans-serif" font-size="76" font-weight="900" fill="url(#cyanBlue)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">ARENA</text>

    <!-- Tagline -->
    <rect x="-240" y="90" width="480" height="32" rx="16" fill="rgba(0,0,0,0.7)" stroke="#FFD700" stroke-width="1.5" />
    <text x="0" y="112" font-family="sans-serif" font-size="16" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="1">"Sansad Se Sadak Tak, Fight Karo!"</text>
  </g>
</svg>
